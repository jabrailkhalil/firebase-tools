name: Author Hosting current-base comparison
on:
  push:
    branches: [validation/hosting-oct29]
permissions:
  contents: read
env:
  CI: true
  NO_COLOR: true
jobs:
  test:
    name: Linux Node24 ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [head, base]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'base' && 'bb495945a0be25cb5a98aa2158e613f4b8cac62a' || '37e11344ddea1c3d32ca54c5a56758b5e571e358' }}
          persist-credentials: false
      - name: Select complete pinned source
        env:
          EXPECTED: ${{ matrix.source == 'base' && 'bb495945a0be25cb5a98aa2158e613f4b8cac62a' || '37e11344ddea1c3d32ca54c5a56758b5e571e358' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --exit-code "$EXPECTED" -- .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm install -g npm@9.5
      - run: npm ci
      - name: Exact existing build, lint, compile and complete unit tests
        run: npm test -- -- --forbid-only
